name: GitHub workflow stats
description: Collect workflow runs into a data branch for a static CI health dashboard
author: unstableunicorn
branding:
  icon: bar-chart-2
  color: blue
inputs:
  token:
    description: >-
      Token to read runs, jobs and test report artifacts (`actions: read`).
      Also writes the data branch unless `data-token` is set
      (`contents: write`).
    default: ${{ github.token }}
  data-branch:
    description: Branch the JSON data is written to. Must not be the data repository's default branch.
    default: gh-workflow-stats-data
  data-repository:
    description: >-
      `owner/name` of the repository to write the data to. Defaults to this
      repository. Use a separate repository when this one's default branch
      cannot be protected.
    default: ''
  data-token:
    description: >-
      Token that can write `data-repository`. Defaults to `token`. With a
      separate data repository, use a GitHub App token that can write only there.
    default: ''
  backfill-days:
    description: On the first run, how many days of history to collect.
    default: '90'
  max-requests:
    description: Approximate cap on API requests per run. The next run resumes.
    default: '300'
  recent-days:
    description: The window, in days, for the headline numbers in summary.json.
    default: '30'
outputs:
  runs-added:
    description: Number of runs added or updated.
  complete:
    description: "'true' when the sync caught up; 'false' when it stopped early."
  synced-through:
    description: Data is complete for runs created before this time (ISO 8601).
runs:
  using: node24
  main: packages/collector/dist/index.js
