name: Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    name: Collect workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # list runs and jobs
      contents: write # commit to the data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./ # zizmor: ignore[self-repository] actionlint cannot parse $/ yet

  build:
    name: Build site
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-workflow-stats-data
          path: site-data
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: npm ci
      - run: npm run build:site
      - name: Add the data next to the site
        run: |
          mkdir -p packages/site/dist/data
          cp site-data/summary.json packages/site/dist/data/
          if [ -d site-data/runs ]; then cp -r site-data/runs packages/site/dist/data/; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write # deploy-pages proves the artifact came from this run
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
